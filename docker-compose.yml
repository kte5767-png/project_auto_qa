name: auto-qa

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoqa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoqa}
      POSTGRES_DB: ${POSTGRES_DB:-autoqa}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-autoqa} -d ${POSTGRES_DB:-autoqa}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
