<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<style>
			body {
				font:
					12px/1.5 Inter,
					system-ui,
					sans-serif;
				margin: 12px;
				color: var(--figma-color-text, #222);
				background: var(--figma-color-bg, #fff);
			}
			h1 {
				font-size: 13px;
				margin: 0 0 8px;
			}
			ul {
				max-height: 180px;
				overflow: auto;
				padding-left: 18px;
				margin: 4px 0 12px;
			}
			label {
				display: block;
				margin: 6px 0;
			}
			button {
				width: 100%;
				padding: 8px;
				margin-top: 8px;
				border: 0;
				border-radius: 6px;
				background: var(--figma-color-bg-brand, #0d99ff);
				color: var(--figma-color-text-onbrand, #fff);
				font-weight: 600;
			}
			button:disabled {
				opacity: 0.5;
			}
			.note {
				color: var(--figma-color-text-secondary, #666);
			}
		</style>
	</head>
	<body>
		<h1>Auto QA 내보내기</h1>
		<p id="summary">프레임을 찾는 중…</p>
		<ul id="frames"></ul>
		<label
			>PNG 배율
			<select id="scale">
				<option value="1" selected>1x</option>
				<option value="0.5">0.5x</option>
				<option value="2">2x</option>
			</select></label
		>
		<label><input id="images" type="checkbox" checked /> 프레임 PNG 포함</label>
		<label
			>한 파일에
			<select id="batch">
				<option value="10">10개씩</option>
				<option value="20" selected>20개씩</option>
				<option value="50">50개씩</option>
				<option value="0">전부 한 파일</option>
			</select></label
		>
		<label>시작 번호 <input id="start" type="number" min="1" value="1" /></label>
		<label
			><input id="auto" type="checkbox" checked /> 나눈 파일을 이어서 자동 저장 (첫 파일만 저장되면 끄고 파일마다
			눌러 저장)</label
		>
		<p class="note">
			프레임이 많으면 나눠 저장합니다. 화면설계서는 PNG 없이도 됩니다. 멈추면 상태 줄의 시작 번호로 이어서
			내보내세요.
		</p>
		<button id="export" disabled>JSON으로 내보내기</button>
		<button id="cancel" disabled>멈추기</button>
		<button id="save-part" hidden>파일 저장</button>
		<p id="status" class="note">파일은 이 PC에만 저장됩니다. 외부로 보내지 않습니다.</p>
		<!-- SCRIPT -->
	</body>
</html>
